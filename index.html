<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VIP Chat</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, "Segoe UI", sans-serif; background: #313338; color: #dbdee1; }
  #app { display: flex; height: 100%; }
  #rail { width: 72px; background: #1e1f22; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; overflow-y: auto; }
  .srv { flex: none; width: 48px; height: 48px; border-radius: 50%; background: #313338; display: grid; place-items: center; cursor: pointer; font-weight: 700; transition: .15s; }
  .srv:hover, .srv.sel { border-radius: 16px; background: #5865f2; color: #fff; }
  .srv.add { color: #23a55a; font-size: 24px; }
  .srv.add:hover { background: #23a55a; color: #fff; }
  #side { width: 240px; background: #2b2d31; display: flex; flex-direction: column; }
  #sname { padding: 16px; font-weight: 700; border-bottom: 1px solid #1e1f22; }
  #chlist { flex: 1; overflow-y: auto; padding: 8px; }
  .ch { padding: 6px 10px; border-radius: 6px; cursor: pointer; color: #949ba4; }
  .ch:hover { background: #35373c; color: #dbdee1; }
  .ch.sel { background: #404249; color: #fff; }
  #addch { margin: 6px 8px; padding: 6px 10px; border: 0; border-radius: 6px; background: none; color: #949ba4; cursor: pointer; text-align: left; }
  #addch:hover { color: #fff; }
  #me { padding: 10px 12px; background: #232428; display: flex; align-items: center; gap: 8px; font-size: 14px; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #head { padding: 14px 16px; font-weight: 700; border-bottom: 1px solid #1e1f22; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; }
  .m { display: flex; gap: 12px; margin-bottom: 14px; }
  .av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; }
  .mh b { color: #fff; margin-right: 8px; }
  .mh small { color: #949ba4; font-size: 11px; }
  .mt { white-space: pre-wrap; word-break: break-word; }
  #box { padding: 0 16px 20px; }
  #inp { width: 100%; padding: 12px 16px; border: 0; border-radius: 8px; background: #383a40; color: #dbdee1; font-size: 15px; outline: none; }
  #members { width: 220px; background: #2b2d31; padding: 16px 8px; overflow-y: auto; }
  #members h5 { margin: 0 8px 8px; font-size: 12px; color: #949ba4; text-transform: uppercase; }
  .mem { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; }
  .mem .av { width: 32px; height: 32px; font-size: 13px; }
  #login { position: fixed; inset: 0; background: #313338; display: none; place-items: center; z-index: 10; }
  #login.on { display: grid; }
  #login div { background: #2b2d31; padding: 32px; border-radius: 12px; width: 340px; text-align: center; }
  #login h2 { margin: 0 0 6px; }
  #login p { color: #949ba4; margin: 0 0 18px; }
  #login input { width: 100%; padding: 12px; border: 0; border-radius: 6px; background: #1e1f22; color: #fff; font-size: 15px; margin-bottom: 12px; outline: none; }
  #login button { width: 100%; padding: 12px; border: 0; border-radius: 6px; background: #5865f2; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div id="login"><div>
  <h2>Welcome to VIP Chat</h2><p>Pick a username to jump in</p>
  <input id="uname" maxlength="20" placeholder="Username" autofocus>
  <button id="go">Continue</button>
</div></div>

<div id="app">
  <div id="rail"></div>
  <div id="side">
    <div id="sname"></div>
    <div id="chlist"></div>
    <button id="addch">+ Add channel</button>
    <div id="me"></div>
  </div>
  <div id="main">
    <div id="head"></div>
    <div id="msgs"></div>
    <div id="box"><input id="inp" placeholder="Message" autocomplete="off"></div>
  </div>
  <div id="members"><h5 id="mcount"></h5><div id="mlist"></div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const av = (n) => '<div class="av" style="background:hsl(' + hue(n) + ',60%,45%)">' + esc((n[0] || '?').toUpperCase()) + '</div>';

let ws, user = '', servers = [], sid = null, cid = null, online = [], msgs = {};
try { user = localStorage.getItem('user') || ''; } catch {}

const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const curServer = () => servers.find(s => s.id === sid);

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => send({ t: 'hello', user });
  ws.onclose = () => setTimeout(connect, 1500);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'servers') {
      servers = m.servers;
      if (!curServer()) sid = servers[0].id;
      if (!curServer().channels.some(c => c.id === cid)) { cid = curServer().channels[0].id; openChannel(); }
      renderAll();
    } else if (m.t === 'online') { online = m.users; renderMembers(); }
    else if (m.t === 'history') { msgs[m.ch] = m.msgs; if (m.ch === cid) renderMsgs(); }
    else if (m.t === 'msg') { (msgs[m.ch] = msgs[m.ch] || []).push(m.msg); if (m.ch === cid) renderMsgs(); }
  };
}
function openChannel() { send({ t: 'open', ch: cid }); }

function renderAll() { renderRail(); renderChannels(); renderMembers(); renderMsgs(); }
function renderRail() {
  const r = $('rail'); r.innerHTML = '';
  servers.forEach(s => {
    const d = document.createElement('div');
    d.className = 'srv' + (s.id === sid ? ' sel' : ''); d.title = s.name; d.textContent = s.name.slice(0, 2).toUpperCase();
    d.onclick = () => { sid = s.id; cid = s.channels[0].id; openChannel(); renderAll(); };
    r.appendChild(d);
  });
  const a = document.createElement('div');
  a.className = 'srv add'; a.textContent = '+'; a.title = 'Create a server';
  a.onclick = () => { const n = prompt('Server name?'); if (n) send({ t: 'newServer', name: n }); };
  r.appendChild(a);
}
function renderChannels() {
  const s = curServer(); if (!s) return;
  $('sname').textContent = s.name;
  const l = $('chlist'); l.innerHTML = '';
  s.channels.forEach(c => {
    const d = document.createElement('div');
    d.className = 'ch' + (c.id === cid ? ' sel' : ''); d.textContent = '# ' + c.name;
    d.onclick = () => { cid = c.id; openChannel(); renderAll(); };
    l.appendChild(d);
  });
  $('me').innerHTML = av(user) + '<span>' + esc(user) + '</span>';
  const ch = s.channels.find(c => c.id === cid);
  $('head').textContent = ch ? '# ' + ch.name : '';
  $('inp').placeholder = ch ? 'Message #' + ch.name : 'Message';
}
function renderMembers() {
  $('mcount').textContent = 'Online — ' + online.length;
  $('mlist').innerHTML = online.map(n => '<div class="mem">' + av(n) + '<span>' + esc(n) + '</span></div>').join('');
}
function renderMsgs() {
  const box = $('msgs');
  box.innerHTML = (msgs[cid] || []).map(m =>
    '<div class="m">' + av(m.user) + '<div><div class="mh"><b>' + esc(m.user) + '</b><small>' +
    new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) +
    '</small></div><div class="mt">' + esc(m.text) + '</div></div></div>').join('');
  box.scrollTop = box.scrollHeight;
}

$('addch').onclick = () => { const n = prompt('Channel name?'); if (n) send({ t: 'newChannel', server: sid, name: n }); };
$('inp').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && $('inp').value.trim()) { send({ t: 'msg', ch: cid, text: $('inp').value }); $('inp').value = ''; }
});

function start() {
  const n = $('uname').value.trim(); if (!n) return;
  user = n.slice(0, 20);
  try { localStorage.setItem('user', user); } catch {}
  $('login').classList.remove('on');
  connect();
}
$('go').onclick = start;
$('uname').addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); });
if (user) connect(); else $('login').classList.add('on');
</script>
</body>
</html>
